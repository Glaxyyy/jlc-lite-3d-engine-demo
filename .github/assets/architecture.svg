<svg xmlns="http://www.w3.org/2000/svg" width="960" height="440" viewBox="0 0 960 440" font-family="system-ui, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <!-- 蓝图网格底 -->
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="rgba(24,113,255,0.07)" stroke-width="1"/>
    </pattern>
    <!-- 箭头（实线：HTTP 请求） -->
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#1871ff"/>
    </marker>
    <!-- 箭头（虚线：iframe 直连） -->
    <marker id="arrowDash" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#5a6b7b"/>
    </marker>
  </defs>

  <rect width="960" height="440" fill="#f4f7fa"/>
  <rect width="960" height="440" fill="url(#grid)"/>

  <g transform="translate(0,-95)">

  <!-- ========== 三个主框 ========== -->
  <!-- 浏览器 -->
  <g>
    <rect x="40" y="170" width="190" height="140" rx="10" fill="#fff" stroke="#c9d6e2" stroke-width="1.5"/>
    <rect x="40" y="170" width="190" height="6" rx="3" fill="#1871ff"/>
    <text x="135" y="208" text-anchor="middle" font-size="16" font-weight="700" fill="#22303c">浏览器 · 本 Demo</text>
    <text x="135" y="234" text-anchor="middle" font-size="12" fill="#5a6b7b">纯前端页面（零依赖）</text>
    <text x="135" y="256" text-anchor="middle" font-family="ui-monospace, Consolas, monospace" font-size="11" fill="#1871ff">index.html + js/*</text>
    <text x="135" y="276" text-anchor="middle" font-size="11" fill="#94a3b8">上传页 ⇄ 预览页</text>
  </g>

  <!-- server.js 本地代理 -->
  <g>
    <rect x="380" y="170" width="190" height="140" rx="10" fill="#fff" stroke="#c9d6e2" stroke-width="1.5"/>
    <rect x="380" y="170" width="190" height="6" rx="3" fill="#1871ff"/>
    <text x="475" y="208" text-anchor="middle" font-size="16" font-weight="700" fill="#22303c">server.js · 本地代理</text>
    <text x="475" y="234" text-anchor="middle" font-family="ui-monospace, Consolas, monospace" font-size="11" fill="#1871ff">node server.js</text>
    <text x="475" y="256" text-anchor="middle" font-size="12" fill="#5a6b7b">静态文件 + /api 转发</text>
    <text x="475" y="276" text-anchor="middle" font-size="11" fill="#94a3b8">零依赖（Node 内置模块）</text>
  </g>

  <!-- 平台 API -->
  <g>
    <rect x="730" y="170" width="190" height="140" rx="10" fill="#fff" stroke="#c9d6e2" stroke-width="1.5"/>
    <rect x="730" y="170" width="190" height="6" rx="3" fill="#1871ff"/>
    <text x="825" y="208" text-anchor="middle" font-size="16" font-weight="700" fill="#22303c">平台 API</text>
    <text x="825" y="234" text-anchor="middle" font-family="ui-monospace, Consolas, monospace" font-size="11" fill="#1871ff">api.forface3d.com</text>
    <text x="825" y="256" text-anchor="middle" font-size="12" fill="#5a6b7b">仅面向服务端调用</text>
    <text x="825" y="276" text-anchor="middle" font-size="11" fill="#94a3b8">（未开放浏览器 CORS）</text>
  </g>

  <!-- 官方预览器 -->
  <g>
    <rect x="730" y="360" width="190" height="70" rx="10" fill="#fff" stroke="#1871ff" stroke-width="1.5"/>
    <text x="825" y="390" text-anchor="middle" font-size="15" font-weight="700" fill="#1871ff">官方预览器</text>
    <text x="825" y="412" text-anchor="middle" font-family="ui-monospace, Consolas, monospace" font-size="11" fill="#1871ff">viewerkit.forface3d.com</text>
  </g>

  <!-- ========== ①②③ 三条接口箭头 ========== -->
  <!-- ① 获取 token -->
  <text x="305" y="192" text-anchor="middle" font-size="11" font-family="ui-monospace, Consolas, monospace" fill="#22303c">① GET getAccessToken</text>
  <line x1="234" y1="205" x2="376" y2="205" stroke="#1871ff" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="574" y1="205" x2="726" y2="205" stroke="#1871ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="652" y="224" text-anchor="middle" font-size="11" fill="#5a6b7b">access_token（缓存复用）</text>

  <!-- ② 上传模型 -->
  <text x="305" y="232" text-anchor="middle" font-size="11" font-family="ui-monospace, Consolas, monospace" fill="#22303c">② POST uploadFile</text>
  <line x1="234" y1="245" x2="376" y2="245" stroke="#1871ff" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="574" y1="245" x2="726" y2="245" stroke="#1871ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="652" y="264" text-anchor="middle" font-size="11" fill="#5a6b7b">id + tokenKey</text>

  <!-- ③ 查询结果 -->
  <text x="305" y="272" text-anchor="middle" font-size="11" font-family="ui-monospace, Consolas, monospace" fill="#22303c">③ POST queryById</text>
  <line x1="234" y1="285" x2="376" y2="285" stroke="#1871ff" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="574" y1="285" x2="726" y2="285" stroke="#1871ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="652" y="304" text-anchor="middle" font-size="11" fill="#5a6b7b">体积 / 表面积 / 包围盒</text>

  <!-- ========== ④ iframe 直连（虚线） ========== -->
  <path d="M135 310 V400 H722" fill="none" stroke="#5a6b7b" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrowDash)"/>
  <text x="430" y="390" text-anchor="middle" font-size="12.5" font-weight="600" fill="#22303c">④ iframe + postMessage(tokenKey) —— 浏览器直连预览器，不经代理</text>
  <text x="825" y="450" text-anchor="middle" font-size="11" fill="#94a3b8">官方设计：预览流量不经过你的后端</text>

  <!-- ========== 图例 ========== -->
  <g font-size="11" fill="#5a6b7b">
    <line x1="40" y1="452" x2="76" y2="452" stroke="#1871ff" stroke-width="2"/>
    <text x="84" y="456">HTTP 请求（经本地代理转发）</text>
    <line x1="290" y1="452" x2="326" y2="452" stroke="#5a6b7b" stroke-width="2" stroke-dasharray="7 5"/>
    <text x="334" y="456">iframe 直连（不经代理 / 后端）</text>
  </g>
  </g>
</svg>
