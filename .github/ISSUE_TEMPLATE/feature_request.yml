name: ✨ 功能建议
description: 提出新功能或改进建议
labels: ['enhancement']
body:
  - type: markdown
    attributes:
      value: |
        感谢建议！提交前请注意：本项目的定位是**极简教学 Demo**（纯 HTML/CSS/JS，零依赖），
        生产级能力（Webhook、token 刷新、后端代理等）请到主仓库 [jlc-lite-3d-engine](https://github.com/Glaxyyy/jlc-lite-3d-engine) 提议。
  - type: textarea
    id: problem
    attributes:
      label: 想解决的问题
      description: 当前有什么不方便或不清楚的地方
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: 期望的方案
      description: 你希望 Demo 怎么做
    validations:
      required: true
